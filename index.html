<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MDA Control"><meta name="theme-color" content="#0a0a0b"><link rel="apple-touch-icon" href="icono-180.png"><style>html,body{margin:0;height:100%}body{background:#0a0a0b}</style></head><body><title>MDA Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concepto: app de puerta para un bar de despecho. Negro, vino y gris claro; número enorme en tipografía condensada; botones grandes para usar con una mano y poca luz. */
:root{
  --sat:env(safe-area-inset-top,0px);
  --bg:#0a0a0b; --surface:#141216; --surface2:#1c1920; --line:#2a262e; --fg:#ece9e6; --muted:#9b97a1; --faint:#6c6870;
  --wine:#7a1a2b; --wine-hi:#a62339; --wine-soft:rgba(122,26,43,.2); --amber:#e8a04a; --red:#d6283d; --green:#3fb27f;
  --track:#221f25; --btn-off:#1d1a20; --on-wine:#fff; --logo-filter:none; --shadow:rgba(0,0,0,.55);
  --f-num:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --f-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --f-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-app="day"]{
  --bg:#eeecea; --surface:#ffffff; --surface2:#f6f4f2; --line:#dcd7d3; --fg:#1b1719; --muted:#625c64; --faint:#8f8991;
  --wine:#7a1a2b; --wine-hi:#8f1f33; --wine-soft:rgba(122,26,43,.1); --amber:#b36a0e; --red:#c01f33; --green:#1b8556;
  --track:#e2dedb; --btn-off:#e4e0dd; --logo-filter:invert(1); --shadow:rgba(60,40,40,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
#app{max-width:460px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);padding-top:var(--sat)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:0 20px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px;min-height:62px}
.ic{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--fg)}
.ic svg{width:24px;height:24px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;min-height:44px;padding-right:10px}
.back svg{width:18px;height:18px}
.add{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:var(--wine);color:var(--on-wine);padding:11px 16px;border-radius:24px;min-height:44px}
.add svg{width:16px;height:16px}
.title{font-family:var(--f-serif);font-weight:600;font-size:34px;line-height:1.1;text-align:center;margin:6px 0 4px}
.cap{font-size:11px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase;font-weight:600}
.center{text-align:center}
.foot{display:flex;justify-content:space-between;gap:10px;padding:10px 20px 14px;font-size:12px;color:var(--faint);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tag{color:var(--amber);font-weight:700;letter-spacing:.1em}
/* counter */
.ringwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:22px auto 0}
.ringwrap svg{position:absolute;inset:0;width:100%;height:100%}
.ringin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--f-num);line-height:.9;letter-spacing:.01em;font-size:min(168px,43vw);color:var(--fg);padding-top:.06em}
.big.warn{color:var(--amber)} .big.full{color:var(--red)}
.of{font-size:13px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;padding:8px 14px;border-radius:20px;border:1px solid var(--c,var(--line));color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,transparent) 14%,transparent);text-transform:uppercase;text-align:center}
.pill.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.statusrow{display:flex;justify-content:center;margin-top:14px;min-height:34px}
.btns{display:flex;justify-content:center;gap:34px;margin:22px 0 8px}
.rb{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:300;line-height:1;transition:transform .08s}
.rb:active:not([disabled]){transform:scale(.94)}
.rb.minus{border:2px solid var(--wine);color:var(--fg)}
.rb.plus{background:var(--wine);color:var(--on-wine)}
.rb[disabled]{background:var(--btn-off);border-color:var(--btn-off);color:var(--faint);cursor:not-allowed}
.rb.sm{width:84px;height:84px;font-size:48px}
.pulse{animation:pulse .22s ease-out}
@keyframes pulse{0%{transform:scale(1.07);filter:brightness(1.3)}100%{transform:scale(1);filter:none}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.mini{display:flex;gap:12px;margin-top:18px}
.mini>div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.mini .k{font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:600}
.mini .v{font-family:var(--f-serif);font-weight:600;font-size:24px;margin-top:2px}
/* cards, lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px}
.card.hi{background:linear-gradient(180deg,var(--wine-soft),var(--surface));border-color:color-mix(in srgb,var(--wine) 55%,var(--line))}
.card .k{font-size:10px;letter-spacing:.22em;color:var(--faint);font-weight:600;margin-bottom:6px;text-transform:uppercase}
.card .k.w{color:var(--wine-hi)}
.stat{font-family:var(--f-serif);font-weight:600;font-size:30px;line-height:1.1}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.msg{margin:30px 4px 0;text-align:center;color:var(--muted);line-height:1.55}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;background:var(--wine);color:var(--on-wine);font-weight:700;letter-spacing:.06em;font-size:15px;border-radius:14px;margin-top:18px;text-transform:uppercase}
.cta[disabled],.cta.off{background:var(--btn-off);color:var(--faint)}
.cta.ghost{background:var(--surface);border:1px solid var(--line);color:var(--fg);text-transform:none;letter-spacing:0}
.row2{display:flex;gap:12px;margin-top:16px}
.row2>*{flex:1}
.btn2{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.btn2.del{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));background:transparent}
.field{margin-top:18px}
.field label{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--muted);font-weight:600;margin-bottom:7px;text-transform:uppercase}
.field label em{font-style:normal;color:var(--wine-hi);margin-left:3px}
.field label s{text-decoration:none;color:var(--faint);letter-spacing:.08em;margin-left:6px;text-transform:none}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:17px;min-height:54px;outline:none}
.inp:focus{border-color:var(--wine-hi)}
textarea.inp{min-height:84px;resize:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.err{display:flex;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-weight:600;font-size:14px;line-height:1.35}
.err small{display:block;font-weight:400;color:var(--muted);margin-top:3px;font-size:12.5px}
/* mesas list */
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 2px;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .a{font-size:16px} .li .b{font-size:12.5px;color:var(--muted);margin-top:2px}
.li .r{display:flex;align-items:center;gap:14px;font-weight:700}
.dot{display:inline-flex;align-items:center;gap:8px;color:var(--c);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.G{--c:var(--faint)}.Y{--c:var(--amber)}.V{--c:var(--green)}.R{--c:var(--red)}
.trash{color:var(--red);width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center}
.trash svg{width:20px;height:20px}
/* drawer */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;animation:fade .15s}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(340px,88%);background:var(--bg);border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding:var(--sat) 18px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:slide .18s ease-out}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(-30px);opacity:0}}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;min-height:62px}
.box{border:1.5px solid var(--wine);background:var(--wine-soft);border-radius:16px;padding:14px 14px 6px;margin-top:4px}
.box .h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;margin-bottom:6px}
.box .h small{font-size:10.5px;letter-spacing:.14em;color:var(--wine-hi);font-weight:700}
.item{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 6px;border-bottom:1px solid var(--line);font-size:16px;width:100%;text-align:left}
.item svg{width:18px;height:18px;color:var(--faint)}
.item.out{border:0;color:var(--muted);font-size:14px;margin-top:auto}
.who{font-size:12px;color:var(--faint);padding:0 6px 4px}
/* sheet + toast */
.sheetwrap{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(0,0,0,.6);animation:fade .15s}
.sheet{width:100%;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h3{font-family:var(--f-serif);font-size:26px;font-weight:600;margin-bottom:4px}
.sheet p{color:var(--muted);font-size:14px}
.toasts{position:absolute;left:12px;right:12px;top:calc(10px + var(--sat));z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--line);border-left:4px solid var(--c,var(--wine-hi));border-radius:12px;padding:12px 14px;font-size:14px;box-shadow:0 8px 24px var(--shadow);animation:slide .2s}
.toast.err{--c:var(--red)} .toast.warn{--c:var(--amber)} .toast.ok{--c:var(--green)}
/* login */
.logo{display:block;width:min(230px,64vw);margin:8vh auto 0;filter:var(--logo-filter)}
.app-name{text-align:center;margin-top:12px;font-size:13px;letter-spacing:.34em;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:18px;margin-top:22px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--wine);display:block}
.dots i.f{background:var(--wine-hi);border-color:var(--wine-hi)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pinbox{position:relative}
.pinbox input{position:absolute;opacity:0;inset:0;width:100%;height:100%}
.demo{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;line-height:1.6}
/* bars, calendar */
.bars{display:flex;align-items:flex-end;gap:14px;height:132px;padding:0 4px;margin-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--wine-hi),var(--wine));border-radius:7px 7px 3px 3px;min-height:3px}
.bars b{font-size:14px;font-variant-numeric:tabular-nums}
.bars small{font-size:11px;color:var(--muted);letter-spacing:.08em}
.wk{display:flex;gap:16px;align-items:flex-end}
.wk .bars{flex:1.4}
.wk .side{flex:1;display:flex;flex-direction:column;gap:12px;padding-bottom:6px}
.wk .side .k{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:10px;letter-spacing:.1em;color:var(--faint);padding:2px 0 4px}
.cal button,.cal span.d{height:38px;border-radius:9px;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--fg);font-variant-numeric:tabular-nums}
.cal .svc{background:var(--surface2);color:var(--muted)}
.cal .off{color:var(--faint);opacity:.45}
.cal .sp{background:var(--wine);color:#fff;font-weight:700}
.cal .td{outline:1.5px solid var(--amber)}
.cal .pick{background:var(--wine-hi);color:#fff;font-weight:700}
.cal .pastd{opacity:.3}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mn b{font-family:var(--f-serif);font-size:22px;font-weight:600;text-transform:capitalize}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.leg span{display:flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:3px;display:block}
.nextrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.nextrow .d{font-family:var(--f-serif);font-weight:600;font-size:21px}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:12px}
.tabs button{flex:1;padding:11px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--wine);color:#fff}
.chips{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
.chips .t{font-size:11px;letter-spacing:.18em;color:var(--faint)}
.chips button{font-size:13px;padding:8px 13px;border-radius:16px;border:1px solid var(--line);color:var(--muted);min-height:36px}
.chips button.on{border-color:var(--wine);background:var(--wine-soft);color:var(--fg)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--btn-off);position:relative;flex:none;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--faint);transition:left .15s}
.sw.on{background:var(--wine);border-color:var(--wine)}.sw.on::after{left:23px;background:#fff}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.set:first-child{border-top:0}
.set small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:8px 11px;border-radius:8px;font-size:13px;color:var(--muted);min-height:36px}
.seg button.on{background:var(--wine);color:#fff}
.sec{margin:22px 2px 0;font-size:10.5px;letter-spacing:.24em;color:var(--wine-hi);font-weight:700}
.time2{display:flex;gap:12px}.time2>div{flex:1}
.nt{font-size:13px;color:var(--muted);padding:8px 0;border-top:1px solid var(--line)}
.nt:first-child{border-top:0}.nt b{color:var(--fg);font-weight:600}
.hero{text-align:center;padding:18px 16px 14px}
.hero .n{font-family:var(--f-num);font-size:96px;line-height:1;padding-top:.05em}
</style>

      p=SB.from('mda_docs').delete().eq('kind',kind).eq('id',id).then(function(r){if(r.error)throw r.error;delete SH[k];});
    }else{
      var obj=cur[k];obj._r=rnext();var js=JSON.stringify(obj);
      p=SB.from('mda_docs').upsert({kind:kind,id:id,data:obj,updated_at:new Date().toISOString()},{onConflict:'kind,id'}).then(function(r){if(r.error)throw r.error;SH[k]=js;});
    }
    return p.then(function(){INF[k]--;},function(){INF[k]--;PEND[k]=PEND[k]||(mark==='del'?'del':1);throw 0;});
  });
  Promise.all(jobs.map(function(j){return j.then(function(){return true;},function(){return false;});})).then(function(rs){
    flushing=false;
    var ok=rs.every(function(x){return x;});
    NET=ok;updNet();
    if(Object.keys(PEND).length)scheduleFlush(ok?0:2500);
  });
}
function updNet(){
  var e=document.getElementById('netst');if(!e)return;
  var pend=Object.keys(PEND).length+Object.keys(INF).filter(function(k){return INF[k]>0;}).length;
  if(!NET){e.textContent='● Sin conexión · reintentando';e.style.color='var(--red)';}
  else if(pend){e.textContent='● Guardando…';e.style.color='var(--amber)';}
  else{e.textContent='● En línea';e.style.color='var(--green)';}
}
function applyDoc(kind,id,data,isInsert){
  var k=dkeyOf(kind,id);
  if(PEND[k]||INF[k]>0)return false;
  var js=JSON.stringify(data);
  if(kind==='night'){
    var loc=S.nights[id];
    if(loc&&data._r&&loc._r&&data._r<=loc._r)return false;
    if(loc&&JSON.stringify(loc)===js){SH[k]=js;return false;}
    S.nights[id]=data;SH[k]=js;return true;
  }
  if(kind==='special'){
    var ex=S.specials.filter(function(x){return x.date===id;})[0];
    if(ex&&JSON.stringify(ex)===js){SH[k]=js;return false;}
    S.specials=S.specials.filter(function(x){return x.date!==id;});S.specials.push(data);SH[k]=js;return true;
  }
  if(kind==='notice'){
    if(S.notices.some(function(x){return x.id===id;})){SH[k]=js;return false;}
    S.notices.push(data);S.notices.sort(function(a,b){return b.t-a.t;});SH[k]=js;
    if(isInsert&&U&&U.role==='owner'&&data.t>=loginAt&&pref(U).notif[data.type])toast('🔔 '+data.msg,'ok');
    return true;
  }
  return false;
}
function removeDoc(kind,id){
  var k=dkeyOf(kind,id);if(PEND[k]||INF[k]>0)return false;
  var had=false;
  if(kind==='night'&&S.nights[id]){delete S.nights[id];had=true;}
  if(kind==='special'){var n0=S.specials.length;S.specials=S.specials.filter(function(x){return x.date!==id;});had=S.specials.length!==n0;}
  if(kind==='notice'){var n1=S.notices.length;S.notices=S.notices.filter(function(x){return x.id!==id;});had=S.notices.length!==n1;}
  delete SH[k];return had;
}
function refreshUI(){
  lastSig='';

  if(document.querySelector('#sheet .sheet')){dirtyUI=true;return;}

function pull(){
  if(!SB)return Promise.resolve(false);
  return SB.from('mda_docs').select('*').then(function(r){
    if(r.error)throw r.error;
    var seen={},ch=false;
    (r.data||[]).forEach(function(d){seen[dkeyOf(d.kind,d.id)]=1;if(applyDoc(d.kind,d.id,d.data,false))ch=true;});
    Object.keys(SH).forEach(function(k){
      if(seen[k]||PEND[k]||INF[k]>0)return;
      var kind=k.slice(0,k.indexOf(':')),id=k.slice(k.indexOf(':')+1);
      if(removeDoc(kind,id))ch=true;
    });
    SYNC=true;NET=true;lastPull=Date.now();updNet();
    if(ch)refreshUI();
    return true;
  }).catch(function(){NET=false;updNet();return false;});
}
function subscribe(){
  if(!SB||chan)return;
  chan=SB.channel('mda-docs').on('postgres_changes',{event:'*',schema:'public',table:'mda_docs'},function(p){
    var ch=false;
    if(p.eventType==='DELETE'){var o=p.old||{};if(o.kind&&o.id)ch=removeDoc(o.kind,o.id);}
    else{var n=p.new||{};if(n.kind)ch=applyDoc(n.kind,n.id,n.data,p.eventType==='INSERT');}
    if(ch)refreshUI();
  }).subscribe();
}

/* ---------- tiempo ---------- */
function now(){return new Date(Date.now()+S.offset);}
function pad(n){return (n<10?'0':'')+n;}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pk(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function atTime(d,hhmm){var p=hhmm.split(':');var x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+p[0],+p[1],0,0);return x;}
function fmtTime(d){var h=d.getHours(),m=d.getMinutes(),s=h>=12?'p.m.':'a.m.';var h12=h%12||12;return h12+':'+pad(m)+' '+s;}
function fmtHHMM(t){var p=t.split(':');return fmtTime(new Date(2000,0,1,+p[0],+p[1]));}
function longDate(d){return DAYS[d.getDay()]+' '+d.getDate()+' de '+MONTHS[d.getMonth()];}
function shortDate(d){return DAYS3[d.getDay()]+' '+d.getDate()+' '+MON3[d.getMonth()];}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '$'+Math.round(n).toLocaleString('es-MX');}

/* ---------- servicio y noches ---------- */
function serviceFor(key){
  var d=pk(key),sp=null,i;
  for(i=0;i<S.specials.length;i++){if(S.specials[i].date===key)sp=S.specials[i];}
  var ot='19:00',ct='02:00',special=false;
  if(sp){ot=sp.open;ct=sp.close;special=true;}
  else if([4,5,6].indexOf(d.getDay())<0)return null;
  var open=atTime(d,ot),close=atTime(d,ct);
  if(close<=open)close=addDays(close,1);
  return {open:open,close:close,special:special,cutoff:new Date(close.getTime()+6*3600e3)};
}
function ctx(t){
  var ys=serviceFor(dkey(addDays(t,-1)));
  if(ys&&t<ys.cutoff)return {phase:t<ys.close?'open':'closed',key:dkey(addDays(t,-1)),svc:ys};
  var k=dkey(t),ts=serviceFor(k);
  if(ts){
    if(t<ts.open)return {phase:'pre',key:k,svc:ts};
    if(t<ts.close)return {phase:'open',key:k,svc:ts};
    if(t<ts.cutoff)return {phase:'closed',key:k,svc:ts};
  }
  return {phase:'none'};
}
function night(key,create){
  var n=S.nights[key];
  if(!n&&create){n=S.nights[key]={key:key,started:false,count:0,entered:0,peak:{v:0,t:null},events:[],mesas:[],cover:null,closedAt:null,nf:{max:0},seq:0};}
  return n;
}
function nextService(t){
  for(var i=0;i<400;i++){
    var d=addDays(t,i),s=serviceFor(dkey(d));
    if(s&&s.open>t)return {date:d,svc:s};
  }
  return null;
}
function blockLabel(ts){
  var d=new Date(ts),m=d.getMinutes()<30?0:30;
  var a=new Date(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),m,0),b=new Date(a.getTime()+30*60000);
  var fa=fmtTime(a),fb=fmtTime(b);
  if(fa.slice(-4)===fb.slice(-4))fa=fa.slice(0,-5);
  return fa+' a '+fb;
}
function summaryOf(n){
  return {entered:n.entered,peakV:n.peak.v,block:n.peak.t?blockLabel(n.peak.t):null,mesas:n.mesas.length,
    cover:n.cover?n.cover.count*n.cover.amount:null,coverCount:n.cover?n.cover.count:0};
}

var U=null;  // usuario con sesión
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function findUser(txt){var q=norm(txt);for(var i=0;i<USERS.length;i++){if(norm(USERS[i].name)===q||USERS[i].id===q)return USERS[i];}return null;}
function pref(u){

/* ---------- avisos (en la versión real serán notificaciones del celular) ---------- */
function toast(msg,kind){
  var box=document.getElementById('toasts');if(!box)return;
  for(var i=0;i<box.children.length;i++){if(box.children[i].textContent===msg)return;}
  var el=document.createElement('div');el.className='toast '+(kind||'');el.textContent=msg;box.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},kind==='err'?4200:3600);
}
function notice(type,msg,id){
  var t=Date.now();id=id||(t.toString(36)+Math.random().toString(36).slice(2,6));
  if(S.notices.some(function(x){return x.id===id;}))return;
  S.notices.unshift({id:id,t:t,type:type,msg:msg});S.notices.sort(function(a,b){return b.t-a.t;});
  if(U&&U.role==='owner'&&pref(U).notif[type])toast('🔔 '+msg,'ok');
}
function haptic(){try{if(navigator.vibrate)navigator.vibrate(18);}catch(e){}}

/* ---------- acciones de conteo ---------- */
function cur(){var c=ctx(now());return {c:c,n:c.phase==='none'?null:night(c.key,false)};}
function plus(mesaId){
  var s=cur(),n=s.n,m=null;
  if(!n||!n.started||s.c.phase==='closed'||s.c.phase==='none')return false;
  if(n.count>=CAP){toast('Aforo lleno: no se puede sumar más.','err');return false;}
  if(mesaId){m=n.mesas.filter(function(x){return x.id===mesaId;})[0];if(!m)return false;}
  n.count++;n.entered++;
  var t=now().getTime();
  if(n.count>n.peak.v)n.peak={v:n.count,t:t};
  n.events.push({t:t,d:1,s:mesaId||'main'});
  if(m){m.arrived++;if(m.arrived===m.size&&!m.done){m.done=true;notice('mesa','Mesa completa: '+m.name+' ('+m.arrived+'/'+m.size+')');}}
  if(n.count>n.nf.max){
    n.nf.max=n.count;
    if(n.count===CAP)notice('aforo','Aforo lleno: 100 personas adentro');
    else if(n.count===WARN)notice('aforo','Aforo en 90 personas: quedan 10 lugares');
    else if(n.count%10===0)notice('cada10','Ya hay '+n.count+' personas adentro');
  }
  save();haptic();return true;
}
function minus(mesaId){
  var s=cur(),n=s.n,m=null;
  if(!n||n.count<=0||(s.c.phase!=='open'&&s.c.phase!=='closed'&&!(s.c.phase==='pre'&&n.started)))return false;
  if(mesaId){m=n.mesas.filter(function(x){return x.id===mesaId;})[0];if(!m||m.arrived<=0)return false;}
  n.count--;n.events.push({t:now().getTime(),d:-1,s:mesaId||'main'});
  if(m){m.arrived--;if(m.arrived<m.size)m.done=false;}
  save();haptic();return true;
}

/* ---------- reloj: abre, cierra y limpia ---------- */
var lastSig='';
function closeNight(n,svc,fromTick){
  n.closedAt=svc.close.getTime();
  var sm=summaryOf(n);
  notice('resumen','Resumen de la noche: '+sm.entered+' personas'+(sm.block?', hora pico '+sm.block:'')+(sm.cover!==null?', cover '+money(sm.cover):'')+'.','resumen-'+n.key);
  if(n.count>0&&U&&U.role==='guard')toast('Aún hay '+n.count+' personas registradas adentro. Resta cada salida con “−”.','warn');
}
function tick(){
  var t=now(),c=ctx(t),changed=false,k;
  var guard=U&&U.role==='guard',live=SYNC&&U;
  if(live){
    for(k in S.nights){
      var n=S.nights[k];
      if(n.closedAt&&t.getTime()-n.closedAt>KEEP_DAYS*864e5){delete S.nights[k];changed=true;continue;}
      if(n.started&&!n.closedAt){var sv=serviceFor(n.key);if(sv&&t>=sv.close){closeNight(n,sv,true);changed=true;}}
    }
    var oldN=S.notices.length;S.notices=S.notices.filter(function(x){return Date.now()-x.t<3*864e5;});if(S.notices.length!==oldN)changed=true;
  }
  if(live&&guard&&c.phase==='open'){
    var o=night(c.key,true);
    if(!o.started){o.started=true;o.count=0;o.entered=0;o.peak={v:0,t:null};o.events=[];o.nf={max:0};o.mesas.forEach(function(m){m.arrived=0;m.done=false;});changed=true;}
  }
  var sig=c.phase+'|'+(c.key||'')+'|'+themeNow();
  if(changed)save();
  var clock=document.getElementById('clock');if(clock)clock.textContent=DAYS[t.getDay()]+' · '+fmtTime(t);
  if(U&&SB&&!document.hidden&&Date.now()-lastPull>20000&&!flushing&&!Object.keys(PEND).length)pull();
  updNet();
  if(changed||sig!==lastSig){
    lastSig=sig;applyTheme();
    if(U&&!V.form)render();
  }
}

function calHTML(sel,mode){

    h+='<div class="sec">AVISOS RECIENTES</div><div class="card" style="margin-top:8px">'+(S.notices.length?S.notices.slice(0,8).map(function(x){var d=new Date(x.t);return '<div class="nt"><b>'+fmtTime(d)+'</b> · '+esc(x.msg)+'</div>';}).join(''):'<p class="sub" style="margin:0">Aún no hay avisos.</p>')+'</div>';

function render(){

  else if(n==='cover')h=coverHTML();
  else if(n==='summary')h=summaryHTML(V.key,V.key&&true);
  else if(n==='history')h=historyHTML();

/* ---------- login ---------- */
function bindLogin(){
  var pin=document.getElementById('lg-pin'),user=document.getElementById('lg-user'),dots=document.getElementById('dots'),msg=document.getElementById('lg-msg');
  if(!pin)return;
  function paint(){var l=pin.value.length;[].forEach.call(dots.children,function(d,i){d.className=i<l?'f':'';});}
  function lock(name){var f=S.fails[name];return f&&f.until&&f.until>Date.now()?f.until-Date.now():0;}
  var busy=false;
  pin.addEventListener('input',function(){
    pin.value=pin.value.replace(/\D/g,'').slice(0,4);paint();
    if(pin.value.length<4||busy)return;
    var u=findUser(user.value);
    if(!u){msg.style.color='var(--red)';msg.textContent='Ese usuario no existe. Escríbelo como aparece abajo.';fail();return;}
    var ms=lock(u.id);
    if(ms){msg.style.color='var(--red)';msg.textContent='Bloqueado. Intenta de nuevo en '+Math.ceil(ms/60000)+' min.';fail();return;}
    if(!sbInit()){msg.style.color='var(--red)';msg.textContent='No hay conexión. Revisa tu internet e intenta de nuevo.';fail();return;}
    busy=true;msg.style.color='var(--muted)';msg.textContent='Entrando…';
    SB.auth.signInWithPassword({email:u.id+MAIL,password:'mda'+pin.value}).then(function(r){
      if(r.error){
        var net=/fetch|network|failed|timeout/i.test(String(r.error.message||''))&&!/invalid/i.test(String(r.error.message||''));
        busy=false;
        if(net){msg.style.color='var(--red)';msg.textContent='No hay conexión. Revisa tu internet e intenta de nuevo.';fail();return;}
        var f=S.fails[u.id]||(S.fails[u.id]={n:0,until:0});f.n++;
        if(f.n>=5){f.until=Date.now()+5*60000;f.n=0;msg.textContent='Demasiados intentos. La app se bloquea 5 minutos.';}
        else msg.textContent='PIN incorrecto. Te quedan '+(5-f.n)+(5-f.n===1?' intento.':' intentos.');
        msg.style.color='var(--red)';saveLocal();fail();return;
      }
      S.fails[u.id]={n:0,until:0};S.lastUser=u.name;saveLocal();
      loginAt=Date.now();
      return pull().then(function(ok){
        busy=false;
        if(!ok){msg.style.color='var(--red)';msg.textContent='No se pudo cargar la información. Intenta de nuevo.';try{SB.auth.signOut();}catch(e){}fail();return;}
        subscribe();U=u;V={name:'home'};D=false;lastSig='';render();tick();
      });
    },function(){busy=false;msg.style.color='var(--red)';msg.textContent='No hay conexión. Revisa tu internet e intenta de nuevo.';fail();});
  });
  function fail(){dots.classList.remove('shake');void dots.offsetWidth;dots.classList.add('shake');pin.value='';paint();}
  document.getElementById('pinbox').addEventListener('click',function(){pin.focus();});
  setTimeout(function(){try{(user.value?pin:user).focus();}catch(e){}},50);
}
